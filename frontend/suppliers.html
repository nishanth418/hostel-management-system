<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppliers</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/students">Students</a>
        <a href="/hostels">Hostels</a>
        <a href="/mess">Mess</a>
        <a href="/payments">Payments</a>
        <a href="/reports">Reports</a>
        <a href="/queries">SQL Query</a>
    </nav>

    <h1>Supplier Management</h1>

    <a href="/" class="back">← Back to Dashboard</a>

    <h2>Suppliers</h2>

    <button onclick="loadData()">Refresh</button>

    <table>

        <thead>
            <tr>
                <th>Supplier ID</th>
                <th>Supplier Name</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>

    </table>

    <div class="add-button-container">
        <button onclick="showForm()">+ Add Supplier</button>
    </div>

    <div class="form-container" id="formContainer" style="display: none;">

        <h2 id="formTitle">Add Supplier</h2>

        <form id="dataForm">

            <label>Supplier ID</label>
            <input type="text" id="supplierid" required>

            <label>Supplier Name</label>
            <input type="text" id="suppliername">

            <button type="submit" id="submitButton">
                Add Supplier
            </button>

            <button type="button" onclick="resetForm()">
                Cancel
            </button>

        </form>

    </div>

    <script>

        let editingId = null;
        let supplierData = [];

        async function loadData() {

            try {

                const response =
                    await fetch("/api/suppliers");

                const data =
                    await response.json();

                supplierData = data;

                const tbody =
                    document.getElementById("tableBody");

                tbody.innerHTML = "";

                if (data.length === 0) {

                    tbody.innerHTML =
                        "<tr><td colspan='3'>No supplier records found.</td></tr>";

                    return;

                }

                data.forEach(row => {

                    const tr =
                        document.createElement("tr");

                    tr.innerHTML = `
                        <td>${escapeHtml(row.supplierid ?? "")}</td>

                        <td>${escapeHtml(row.suppliername ?? "")}</td>

                        <td>
                            <button onclick="editData('${escapeJs(row.supplierid)}')">
                                Edit
                            </button>

                            <button onclick="deleteData('${escapeJs(row.supplierid)}')">
                                Delete
                            </button>
                        </td>
                    `;

                    tbody.appendChild(tr);

                });

            } catch (error) {

                console.error(error);

                alert("Error loading suppliers");

            }

        }

        function showForm() {

            if (editingId === null) {

                document.getElementById("dataForm").reset();

                document.getElementById("formTitle").textContent =
                    "Add Supplier";

                document.getElementById("submitButton").textContent =
                    "Add Supplier";

            }

            document.getElementById("formContainer").style.display =
                "block";

            document.getElementById("supplierid").disabled =
                editingId !== null;

            window.scrollTo({
                top: document.getElementById("formContainer").offsetTop,
                behavior: "smooth"
            });

        }

        function editData(id) {

            try {

                const row =
                    supplierData.find(
                        x => x.supplierid === id
                    );

                if (!row) {

                    alert("Supplier not found");

                    return;

                }

                editingId = id;

                document.getElementById("supplierid").value =
                    row.supplierid ?? "";

                document.getElementById("suppliername").value =
                    row.suppliername ?? "";

                document.getElementById("supplierid").disabled =
                    true;

                document.getElementById("formTitle").textContent =
                    "Edit Supplier";

                document.getElementById("submitButton").textContent =
                    "Update Supplier";

                document.getElementById("formContainer").style.display =
                    "block";

                window.scrollTo({
                    top: document.getElementById("formContainer").offsetTop,
                    behavior: "smooth"
                });

            } catch (error) {

                console.error(error);

                alert("Error loading supplier");

            }

        }

        document.getElementById("dataForm")
            .addEventListener(
                "submit",
                async function (e) {

                    e.preventDefault();

                    const data = {

                        supplierid:
                            document.getElementById("supplierid").value.trim(),

                        suppliername:
                            document.getElementById("suppliername").value.trim()

                    };

                    try {

                        const url =
                            editingId === null
                                ? "/api/suppliers"
                                : "/api/suppliers/" +
                                encodeURIComponent(editingId);

                        const method =
                            editingId === null
                                ? "POST"
                                : "PUT";

                        const response =
                            await fetch(url, {

                                method: method,

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify(data)

                            });

                        const result =
                            await response.json();

                        if (!response.ok) {

                            alert(
                                result.error ||
                                "Operation failed"
                            );

                            return;

                        }

                        if (editingId === null) {

                            alert(
                                "Supplier added successfully"
                            );

                        } else {

                            alert(
                                "Supplier updated successfully"
                            );

                        }

                        resetForm();

                        loadData();

                    } catch (error) {

                        console.error(error);

                        alert("Error saving supplier");

                    }

                }
            );

        async function deleteData(id) {

            if (
                !confirm(
                    "Are you sure you want to delete supplier " +
                    id +
                    "?"
                )
            ) {

                return;

            }

            try {

                const response =
                    await fetch(
                        "/api/suppliers/" +
                        encodeURIComponent(id),
                        {
                            method: "DELETE"
                        }
                    );

                const result =
                    await response.json();

                if (!response.ok) {

                    alert(
                        result.error ||
                        "Delete failed"
                    );

                    return;

                }

                alert(
                    "Supplier deleted successfully"
                );

                loadData();

            } catch (error) {

                console.error(error);

                alert("Error deleting supplier");

            }

        }

        function resetForm() {

            editingId = null;

            document.getElementById("dataForm").reset();

            document.getElementById("supplierid").disabled =
                false;

            document.getElementById("formTitle").textContent =
                "Add Supplier";

            document.getElementById("submitButton").textContent =
                "Add Supplier";

            document.getElementById("formContainer").style.display =
                "none";

        }

        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }

        function escapeJs(value) {

            return String(value)
                .replaceAll("\\", "\\\\")
                .replaceAll("'", "\\'");

        }

        loadData();

    </script>

</body>

</html>
