<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/students">Students</a>
        <a href="/hostels">Hostels</a>
        <a href="/mess">Mess</a>
        <a href="/payments">Payments</a>
        <a href="/reports">Reports</a>
        <a href="/queries">SQL Query</a>
    </nav>

    <h1>Staff Management</h1>

    <a href="/" class="back">← Back to Dashboard</a>

    <h2>Staff</h2>

    <button onclick="loadData()">Refresh</button>

    <table>

        <thead>
            <tr>
                <th>Staff ID</th>
                <th>Name</th>
                <th>Joining Date</th>
                <th>Salary</th>
                <th>Designation</th>
                <th>Mess ID</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>

    </table>

    <div class="add-button-container">
        <button onclick="showForm()">+ Add Staff</button>
    </div>

    <div class="form-container" id="formContainer" style="display: none;">

        <h2 id="formTitle">Add Staff</h2>

        <form id="dataForm">

            <label>Staff ID</label>
            <input type="text" id="staffid" required>

            <label>Staff Name</label>
            <input type="text" id="staffname">

            <label>Joining Date</label>
            <input type="date" id="joiningdate">

            <label>Salary</label>
            <input type="number" id="salary">

            <label>Designation</label>
            <input type="text" id="designation">

            <label>Mess ID</label>
            <select id="messid">
                <option value="">Select Mess</option>
            </select>

            <button type="submit" id="submitButton">
                Add Staff
            </button>

            <button type="button" onclick="resetForm()">
                Cancel
            </button>

        </form>

    </div>

    <script>

        let editingId = null;
        let staffData = [];

        function formatDate(d) {

            if (!d) {
                return "";
            }

            const x = new Date(d);

            return x.getFullYear() +
                "-" +
                String(x.getMonth() + 1).padStart(2, "0") +
                "-" +
                String(x.getDate()).padStart(2, "0");

        }

        async function loadMess() {

            try {

                const response =
                    await fetch("/api/mess");

                const data =
                    await response.json();

                const select =
                    document.getElementById("messid");

                select.innerHTML =
                    '<option value="">Select Mess</option>';

                data.forEach(row => {

                    const option =
                        document.createElement("option");

                    option.value =
                        row.messid;

                    option.textContent =
                        row.messid +
                        " - " +
                        row.messname;

                    select.appendChild(option);

                });

            } catch (error) {

                console.error(error);

                alert("Error loading mess");

            }

        }

        async function loadData() {

            try {

                const response =
                    await fetch("/api/staff");

                const data =
                    await response.json();

                staffData = data;

                const tbody =
                    document.getElementById("tableBody");

                tbody.innerHTML = "";

                if (data.length === 0) {

                    tbody.innerHTML =
                        "<tr><td colspan='7'>No staff records found.</td></tr>";

                    return;

                }

                data.forEach(row => {

                    const tr =
                        document.createElement("tr");

                    tr.innerHTML = `
                        <td>${escapeHtml(row.staffid ?? "")}</td>

                        <td>${escapeHtml(row.staffname ?? "")}</td>

                        <td>${formatDate(row.joiningdate)}</td>

                        <td>${escapeHtml(row.salary ?? "")}</td>

                        <td>${escapeHtml(row.designation ?? "")}</td>

                        <td>${escapeHtml(row.messid ?? "")}</td>

                        <td>
                            <button onclick="editData('${escapeJs(row.staffid)}')">
                                Edit
                            </button>

                            <button onclick="deleteData('${escapeJs(row.staffid)}')">
                                Delete
                            </button>
                        </td>
                    `;

                    tbody.appendChild(tr);

                });

            } catch (error) {

                console.error(error);

                alert("Error loading staff");

            }

        }

        async function showForm() {

            await loadMess();

            if (editingId === null) {

                document.getElementById("dataForm").reset();

                document.getElementById("formTitle").textContent =
                    "Add Staff";

                document.getElementById("submitButton").textContent =
                    "Add Staff";

            }

            document.getElementById("formContainer").style.display =
                "block";

            document.getElementById("staffid").disabled =
                editingId !== null;

            window.scrollTo({
                top: document.getElementById("formContainer").offsetTop,
                behavior: "smooth"
            });

        }

        async function editData(id) {

            try {

                const row =
                    staffData.find(
                        x => x.staffid === id
                    );

                if (!row) {

                    alert("Staff not found");

                    return;

                }

                editingId = id;

                await loadMess();

                document.getElementById("staffid").value =
                    row.staffid ?? "";

                document.getElementById("staffname").value =
                    row.staffname ?? "";

                document.getElementById("joiningdate").value =
                    formatDate(row.joiningdate);

                document.getElementById("salary").value =
                    row.salary ?? "";

                document.getElementById("designation").value =
                    row.designation ?? "";

                document.getElementById("messid").value =
                    row.messid ?? "";

                document.getElementById("staffid").disabled =
                    true;

                document.getElementById("formTitle").textContent =
                    "Edit Staff";

                document.getElementById("submitButton").textContent =
                    "Update Staff";

                document.getElementById("formContainer").style.display =
                    "block";

                window.scrollTo({
                    top: document.getElementById("formContainer").offsetTop,
                    behavior: "smooth"
                });

            } catch (error) {

                console.error(error);

                alert("Error loading staff");

            }

        }

        document.getElementById("dataForm")
            .addEventListener(
                "submit",
                async function (e) {

                    e.preventDefault();

                    const data = {

                        staffid:
                            document.getElementById("staffid").value.trim(),

                        staffname:
                            document.getElementById("staffname").value.trim(),

                        joiningdate:
                            document.getElementById("joiningdate").value || null,

                        salary:
                            document.getElementById("salary").value || null,

                        designation:
                            document.getElementById("designation").value.trim(),

                        messid:
                            document.getElementById("messid").value || null

                    };

                    try {

                        const url =
                            editingId === null
                                ? "/api/staff"
                                : "/api/staff/" +
                                encodeURIComponent(editingId);

                        const method =
                            editingId === null
                                ? "POST"
                                : "PUT";

                        const response =
                            await fetch(url, {

                                method: method,

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify(data)

                            });

                        const result =
                            await response.json();

                        if (!response.ok) {

                            alert(
                                result.error ||
                                "Operation failed"
                            );

                            return;

                        }

                        if (editingId === null) {

                            alert(
                                "Staff added successfully"
                            );

                        } else {

                            alert(
                                "Staff updated successfully"
                            );

                        }

                        resetForm();

                        loadData();

                    } catch (error) {

                        console.error(error);

                        alert("Error saving staff");

                    }

                }
            );

        async function deleteData(id) {

            if (
                !confirm(
                    "Are you sure you want to delete staff " +
                    id +
                    "?"
                )
            ) {

                return;

            }

            try {

                const response =
                    await fetch(
                        "/api/staff/" +
                        encodeURIComponent(id),
                        {
                            method: "DELETE"
                        }
                    );

                const result =
                    await response.json();

                if (!response.ok) {

                    alert(
                        result.error ||
                        "Delete failed"
                    );

                    return;

                }

                alert(
                    "Staff deleted successfully"
                );

                loadData();

            } catch (error) {

                console.error(error);

                alert("Error deleting staff");

            }

        }

        function resetForm() {

            editingId = null;

            document.getElementById("dataForm").reset();

            document.getElementById("staffid").disabled =
                false;

            document.getElementById("formTitle").textContent =
                "Add Staff";

            document.getElementById("submitButton").textContent =
                "Add Staff";

            document.getElementById("formContainer").style.display =
                "none";

        }

        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }

        function escapeJs(value) {

            return String(value)
                .replaceAll("\\", "\\\\")
                .replaceAll("'", "\\'");

        }

        loadMess();
        loadData();

    </script>

</body>

</html>
