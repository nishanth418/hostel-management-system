<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess Contacts</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/students">Students</a>
        <a href="/hostels">Hostels</a>
        <a href="/mess">Mess</a>
        <a href="/payments">Payments</a>
        <a href="/reports">Reports</a>
        <a href="/queries">SQL Query</a>
    </nav>

    <h1>Mess Contact Management</h1>

    <a href="/" class="back">← Back to Dashboard</a>

    <h2>Mess Contacts</h2>

    <button onclick="loadData()">Refresh</button>

    <table>

        <thead>
            <tr>
                <th>Mess ID</th>
                <th>Phone Number</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>

    </table>

    <div class="add-button-container">
        <button onclick="showForm()">+ Add Mess Contact</button>
    </div>

    <div class="form-container" id="formContainer" style="display: none;">

        <h2 id="formTitle">Add Mess Contact</h2>

        <form id="dataForm">

            <label>Mess ID</label>
            <select id="messid" required>
                <option value="">Select Mess</option>
            </select>

            <label>Phone Number</label>
            <input type="text" id="phoneno" required>

            <button type="submit" id="submitButton">
                Add Mess Contact
            </button>

            <button type="button" onclick="resetForm()">
                Cancel
            </button>

        </form>

    </div>

    <script>

        let oldMessId = null;
        let oldPhone = null;
        let messContactData = [];

        async function loadMess() {

            try {

                const response =
                    await fetch("/api/mess");

                const data =
                    await response.json();

                const select =
                    document.getElementById("messid");

                select.innerHTML =
                    '<option value="">Select Mess</option>';

                data.forEach(row => {

                    const option =
                        document.createElement("option");

                    option.value =
                        row.messid;

                    option.textContent =
                        row.messid +
                        " - " +
                        row.messname;

                    select.appendChild(option);

                });

            } catch (error) {

                console.error(error);

                alert("Error loading mess");

            }

        }

        async function loadData() {

            try {

                const response =
                    await fetch("/api/mess-contacts");

                const data =
                    await response.json();

                messContactData = data;

                const tbody =
                    document.getElementById("tableBody");

                tbody.innerHTML = "";

                if (data.length === 0) {

                    tbody.innerHTML =
                        "<tr><td colspan='3'>No mess contact records found.</td></tr>";

                    return;

                }

                data.forEach(row => {

                    const tr =
                        document.createElement("tr");

                    tr.innerHTML = `
                        <td>${escapeHtml(row.messid ?? "")}</td>

                        <td>${escapeHtml(row.phoneno ?? "")}</td>

                        <td>
                            <button onclick="editData('${escapeJs(row.messid)}','${escapeJs(row.phoneno)}')">
                                Edit
                            </button>

                            <button onclick="deleteData('${escapeJs(row.messid)}','${escapeJs(row.phoneno)}')">
                                Delete
                            </button>
                        </td>
                    `;

                    tbody.appendChild(tr);

                });

            } catch (error) {

                console.error(error);

                alert("Error loading mess contacts");

            }

        }

        async function showForm() {

            await loadMess();

            if (oldMessId === null) {

                document.getElementById("dataForm").reset();

                document.getElementById("formTitle").textContent =
                    "Add Mess Contact";

                document.getElementById("submitButton").textContent =
                    "Add Mess Contact";

            }

            document.getElementById("formContainer").style.display =
                "block";

            document.getElementById("messid").disabled =
                oldMessId !== null;

            window.scrollTo({
                top: document.getElementById("formContainer").offsetTop,
                behavior: "smooth"
            });

        }

        async function editData(messId, phone) {

            try {

                const row =
                    messContactData.find(
                        x =>
                            x.messid === messId &&
                            x.phoneno === phone
                    );

                if (!row) {

                    alert("Mess contact not found");

                    return;

                }

                oldMessId = messId;
                oldPhone = phone;

                await loadMess();

                document.getElementById("messid").value =
                    row.messid ?? "";

                document.getElementById("phoneno").value =
                    row.phoneno ?? "";

                document.getElementById("messid").disabled =
                    true;

                document.getElementById("formTitle").textContent =
                    "Edit Mess Contact";

                document.getElementById("submitButton").textContent =
                    "Update Mess Contact";

                document.getElementById("formContainer").style.display =
                    "block";

                window.scrollTo({
                    top: document.getElementById("formContainer").offsetTop,
                    behavior: "smooth"
                });

            } catch (error) {

                console.error(error);

                alert("Error loading mess contact");

            }

        }

        document.getElementById("dataForm")
            .addEventListener(
                "submit",
                async function (e) {

                    e.preventDefault();

                    const data = {

                        messid:
                            document.getElementById("messid").value,

                        phoneno:
                            document.getElementById("phoneno").value.trim()

                    };

                    try {

                        const url =
                            oldMessId === null
                                ? "/api/mess-contacts"
                                : "/api/mess-contacts/" +
                                encodeURIComponent(oldMessId) +
                                "/" +
                                encodeURIComponent(oldPhone);

                        const method =
                            oldMessId === null
                                ? "POST"
                                : "PUT";

                        const response =
                            await fetch(url, {

                                method: method,

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify(data)

                            });

                        const result =
                            await response.json();

                        if (!response.ok) {

                            alert(
                                result.error ||
                                "Operation failed"
                            );

                            return;

                        }

                        if (oldMessId === null) {

                            alert(
                                "Mess contact added successfully"
                            );

                        } else {

                            alert(
                                "Mess contact updated successfully"
                            );

                        }

                        resetForm();

                        loadData();

                    } catch (error) {

                        console.error(error);

                        alert("Error saving mess contact");

                    }

                }
            );

        async function deleteData(messId, phone) {

            if (
                !confirm(
                    "Are you sure you want to delete this mess contact?"
                )
            ) {

                return;

            }

            try {

                const response =
                    await fetch(
                        "/api/mess-contacts/" +
                        encodeURIComponent(messId) +
                        "/" +
                        encodeURIComponent(phone),
                        {
                            method: "DELETE"
                        }
                    );

                const result =
                    await response.json();

                if (!response.ok) {

                    alert(
                        result.error ||
                        "Delete failed"
                    );

                    return;

                }

                alert(
                    "Mess contact deleted successfully"
                );

                loadData();

            } catch (error) {

                console.error(error);

                alert("Error deleting mess contact");

            }

        }

        function resetForm() {

            oldMessId = null;
            oldPhone = null;

            document.getElementById("dataForm").reset();

            document.getElementById("messid").disabled =
                false;

            document.getElementById("formTitle").textContent =
                "Add Mess Contact";

            document.getElementById("submitButton").textContent =
                "Add Mess Contact";

            document.getElementById("formContainer").style.display =
                "none";

        }

        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }

        function escapeJs(value) {

            return String(value)
                .replaceAll("\\", "\\\\")
                .replaceAll("'", "\\'");

        }

        loadMess();
        loadData();

    </script>

</body>

</html>
