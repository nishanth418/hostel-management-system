<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Phones</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/students">Students</a>
        <a href="/hostels">Hostels</a>
        <a href="/mess">Mess</a>
        <a href="/payments">Payments</a>
        <a href="/reports">Reports</a>
        <a href="/queries">SQL Query</a>
    </nav>

    <h1>Supplier Phone Management</h1>

    <a href="/" class="back">← Back to Dashboard</a>

    <h2>Supplier Phones</h2>

    <button onclick="loadData()">Refresh</button>

    <table>

        <thead>
            <tr>
                <th>Supplier ID</th>
                <th>Phone Number</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>

    </table>

    <div class="add-button-container">
        <button onclick="showForm()">+ Add Supplier Phone</button>
    </div>

    <div class="form-container" id="formContainer" style="display: none;">

        <h2 id="formTitle">Add Supplier Phone</h2>

        <form id="dataForm">

            <label>Supplier ID</label>
            <select id="supplierid" required>
                <option value="">Select Supplier</option>
            </select>

            <label>Phone Number</label>
            <input type="text" id="phoneno" required>

            <button type="submit" id="submitButton">
                Add Supplier Phone
            </button>

            <button type="button" onclick="resetForm()">
                Cancel
            </button>

        </form>

    </div>

    <script>

        let oldId = null;
        let oldPhone = null;
        let supplierPhoneData = [];

        async function loadSuppliers() {

            try {

                const response =
                    await fetch("/api/suppliers");

                const data =
                    await response.json();

                const select =
                    document.getElementById("supplierid");

                select.innerHTML =
                    '<option value="">Select Supplier</option>';

                data.forEach(row => {

                    const option =
                        document.createElement("option");

                    option.value =
                        row.supplierid;

                    option.textContent =
                        row.supplierid +
                        " - " +
                        row.suppliername;

                    select.appendChild(option);

                });

            } catch (error) {

                console.error(error);

                alert("Error loading suppliers");

            }

        }

        async function loadData() {

            try {

                const response =
                    await fetch("/api/supplier-phones");

                const data =
                    await response.json();

                supplierPhoneData = data;

                const tbody =
                    document.getElementById("tableBody");

                tbody.innerHTML = "";

                if (data.length === 0) {

                    tbody.innerHTML =
                        "<tr><td colspan='3'>No supplier phone records found.</td></tr>";

                    return;

                }

                data.forEach(row => {

                    const tr =
                        document.createElement("tr");

                    tr.innerHTML = `
                        <td>${escapeHtml(row.supplierid ?? "")}</td>

                        <td>${escapeHtml(row.phoneno ?? "")}</td>

                        <td>
                            <button onclick="editData('${escapeJs(row.supplierid)}','${escapeJs(row.phoneno)}')">
                                Edit
                            </button>

                            <button onclick="deleteData('${escapeJs(row.supplierid)}','${escapeJs(row.phoneno)}')">
                                Delete
                            </button>
                        </td>
                    `;

                    tbody.appendChild(tr);

                });

            } catch (error) {

                console.error(error);

                alert("Error loading supplier phones");

            }

        }

        async function showForm() {

            await loadSuppliers();

            if (oldId === null) {

                document.getElementById("dataForm").reset();

                document.getElementById("formTitle").textContent =
                    "Add Supplier Phone";

                document.getElementById("submitButton").textContent =
                    "Add Supplier Phone";

            }

            document.getElementById("formContainer").style.display =
                "block";

            document.getElementById("supplierid").disabled =
                oldId !== null;

            window.scrollTo({
                top: document.getElementById("formContainer").offsetTop,
                behavior: "smooth"
            });

        }

        function editData(supplierId, phone) {

            try {

                const row =
                    supplierPhoneData.find(
                        x =>
                            x.supplierid === supplierId &&
                            x.phoneno === phone
                    );

                if (!row) {

                    alert("Supplier phone not found");

                    return;

                }

                oldId = supplierId;
                oldPhone = phone;

                loadSuppliers().then(() => {

                    document.getElementById("supplierid").value =
                        row.supplierid ?? "";

                    document.getElementById("phoneno").value =
                        row.phoneno ?? "";

                    document.getElementById("supplierid").disabled =
                        true;

                    document.getElementById("formTitle").textContent =
                        "Edit Supplier Phone";

                    document.getElementById("submitButton").textContent =
                        "Update Supplier Phone";

                    document.getElementById("formContainer").style.display =
                        "block";

                    window.scrollTo({
                        top: document.getElementById("formContainer").offsetTop,
                        behavior: "smooth"
                    });

                });

            } catch (error) {

                console.error(error);

                alert("Error loading supplier phone");

            }

        }

        document.getElementById("dataForm")
            .addEventListener(
                "submit",
                async function (e) {

                    e.preventDefault();

                    const data = {

                        supplierid:
                            document.getElementById("supplierid").value,

                        phoneno:
                            document.getElementById("phoneno").value.trim()

                    };

                    try {

                        const url =
                            oldId === null
                                ? "/api/supplier-phones"
                                : "/api/supplier-phones/" +
                                encodeURIComponent(oldId) +
                                "/" +
                                encodeURIComponent(oldPhone);

                        const method =
                            oldId === null
                                ? "POST"
                                : "PUT";

                        const response =
                            await fetch(url, {

                                method: method,

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify(data)

                            });

                        const result =
                            await response.json();

                        if (!response.ok) {

                            alert(
                                result.error ||
                                "Operation failed"
                            );

                            return;

                        }

                        if (oldId === null) {

                            alert(
                                "Supplier phone added successfully"
                            );

                        } else {

                            alert(
                                "Supplier phone updated successfully"
                            );

                        }

                        resetForm();

                        loadData();

                    } catch (error) {

                        console.error(error);

                        alert("Error saving supplier phone");

                    }

                }
            );

        async function deleteData(supplierId, phone) {

            if (
                !confirm(
                    "Are you sure you want to delete this supplier phone?"
                )
            ) {

                return;

            }

            try {

                const response =
                    await fetch(
                        "/api/supplier-phones/" +
                        encodeURIComponent(supplierId) +
                        "/" +
                        encodeURIComponent(phone),
                        {
                            method: "DELETE"
                        }
                    );

                const result =
                    await response.json();

                if (!response.ok) {

                    alert(
                        result.error ||
                        "Delete failed"
                    );

                    return;

                }

                alert(
                    "Supplier phone deleted successfully"
                );

                loadData();

            } catch (error) {

                console.error(error);

                alert("Error deleting supplier phone");

            }

        }

        function resetForm() {

            oldId = null;
            oldPhone = null;

            document.getElementById("dataForm").reset();

            document.getElementById("supplierid").disabled =
                false;

            document.getElementById("formTitle").textContent =
                "Add Supplier Phone";

            document.getElementById("submitButton").textContent =
                "Add Supplier Phone";

            document.getElementById("formContainer").style.display =
                "none";

        }

        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }

        function escapeJs(value) {

            return String(value)
                .replaceAll("\\", "\\\\")
                .replaceAll("'", "\\'");

        }

        loadSuppliers();
        loadData();

    </script>

</body>

</html>
