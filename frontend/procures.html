<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procures</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>

<body>

    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/students">Students</a>
        <a href="/hostels">Hostels</a>
        <a href="/mess">Mess</a>
        <a href="/payments">Payments</a>
        <a href="/reports">Reports</a>
        <a href="/queries">SQL Query</a>
    </nav>

    <h1>Procurement Management</h1>

    <a href="/" class="back">← Back to Dashboard</a>

    <h2>Procures</h2>

    <button onclick="loadData()">Refresh</button>

    <table>

        <thead>
            <tr>
                <th>Mess ID</th>
                <th>Supplier ID</th>
                <th>Item ID</th>
                <th>Quantity</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>

    </table>

    <div class="add-button-container">
        <button onclick="showForm()">+ Add Procurement</button>
    </div>

    <div class="form-container" id="formContainer" style="display: none;">

        <h2 id="formTitle">Add Procurement</h2>

        <form id="dataForm">

            <label>Mess ID</label>
            <select id="messid" required>
                <option value="">Select Mess</option>
            </select>

            <label>Supplier ID</label>
            <select id="supplierid" required>
                <option value="">Select Supplier</option>
            </select>

            <label>Item ID</label>
            <select id="itemid" required>
                <option value="">Select Item</option>
            </select>

            <label>Quantity</label>
            <input type="number" id="quantity" min="0" required>

            <button type="submit" id="submitButton">
                Add Procurement
            </button>

            <button type="button" onclick="resetForm()">
                Cancel
            </button>

        </form>

    </div>

    <script>

        let oldMess = null;
        let oldSupplier = null;
        let oldItem = null;
        let procurementData = [];

        async function loadMess() {

            try {

                const response =
                    await fetch("/api/mess");

                const data =
                    await response.json();

                const select =
                    document.getElementById("messid");

                select.innerHTML =
                    '<option value="">Select Mess</option>';

                data.forEach(row => {

                    const option =
                        document.createElement("option");

                    option.value =
                        row.messid;

                    option.textContent =
                        row.messid +
                        " - " +
                        row.messname;

                    select.appendChild(option);

                });

            } catch (error) {

                console.error(error);

                alert("Error loading mess");

            }

        }

        async function loadSuppliers() {

            try {

                const response =
                    await fetch("/api/suppliers");

                const data =
                    await response.json();

                const select =
                    document.getElementById("supplierid");

                select.innerHTML =
                    '<option value="">Select Supplier</option>';

                data.forEach(row => {

                    const option =
                        document.createElement("option");

                    option.value =
                        row.supplierid;

                    option.textContent =
                        row.supplierid +
                        " - " +
                        row.suppliername;

                    select.appendChild(option);

                });

            } catch (error) {

                console.error(error);

                alert("Error loading suppliers");

            }

        }

        async function loadItems() {

            try {

                const response =
                    await fetch("/api/inventory");

                const data =
                    await response.json();

                const select =
                    document.getElementById("itemid");

                select.innerHTML =
                    '<option value="">Select Item</option>';

                data.forEach(row => {

                    const option =
                        document.createElement("option");

                    option.value =
                        row.itemid;

                    option.textContent =
                        row.itemid +
                        " - " +
                        row.itemname;

                    select.appendChild(option);

                });

            } catch (error) {

                console.error(error);

                alert("Error loading inventory items");

            }

        }

        async function loadData() {

            try {

                const response =
                    await fetch("/api/procures");

                const data =
                    await response.json();

                procurementData = data;

                const tbody =
                    document.getElementById("tableBody");

                tbody.innerHTML = "";

                if (data.length === 0) {

                    tbody.innerHTML =
                        "<tr><td colspan='5'>No procurement records found.</td></tr>";

                    return;

                }

                data.forEach(row => {

                    const tr =
                        document.createElement("tr");

                    tr.innerHTML = `
                        <td>${escapeHtml(row.messid ?? "")}</td>

                        <td>${escapeHtml(row.supplierid ?? "")}</td>

                        <td>${escapeHtml(row.itemid ?? "")}</td>

                        <td>${escapeHtml(row.quantity ?? "")}</td>

                        <td>
                            <button onclick="editData('${escapeJs(row.messid)}','${escapeJs(row.supplierid)}','${escapeJs(row.itemid)}')">
                                Edit
                            </button>

                            <button onclick="deleteData('${escapeJs(row.messid)}','${escapeJs(row.supplierid)}','${escapeJs(row.itemid)}')">
                                Delete
                            </button>
                        </td>
                    `;

                    tbody.appendChild(tr);

                });

            } catch (error) {

                console.error(error);

                alert("Error loading procurement data");

            }

        }

        async function showForm() {

            await loadMess();
            await loadSuppliers();
            await loadItems();

            if (oldMess === null) {

                document.getElementById("dataForm").reset();

                document.getElementById("formTitle").textContent =
                    "Add Procurement";

                document.getElementById("submitButton").textContent =
                    "Add Procurement";

            }

            document.getElementById("formContainer").style.display =
                "block";

            document.getElementById("messid").disabled =
                oldMess !== null;

            document.getElementById("supplierid").disabled =
                oldMess !== null;

            document.getElementById("itemid").disabled =
                oldMess !== null;

            window.scrollTo({
                top: document.getElementById("formContainer").offsetTop,
                behavior: "smooth"
            });

        }

        async function editData(messId, supplierId, itemId) {

            try {

                const row =
                    procurementData.find(
                        x =>
                            x.messid === messId &&
                            x.supplierid === supplierId &&
                            x.itemid === itemId
                    );

                if (!row) {

                    alert("Procurement record not found");

                    return;

                }

                oldMess = messId;
                oldSupplier = supplierId;
                oldItem = itemId;

                await loadMess();
                await loadSuppliers();
                await loadItems();

                document.getElementById("messid").value =
                    row.messid ?? "";

                document.getElementById("supplierid").value =
                    row.supplierid ?? "";

                document.getElementById("itemid").value =
                    row.itemid ?? "";

                document.getElementById("quantity").value =
                    row.quantity ?? "";

                document.getElementById("messid").disabled =
                    true;

                document.getElementById("supplierid").disabled =
                    true;

                document.getElementById("itemid").disabled =
                    true;

                document.getElementById("formTitle").textContent =
                    "Edit Procurement";

                document.getElementById("submitButton").textContent =
                    "Update Procurement";

                document.getElementById("formContainer").style.display =
                    "block";

                window.scrollTo({
                    top: document.getElementById("formContainer").offsetTop,
                    behavior: "smooth"
                });

            } catch (error) {

                console.error(error);

                alert("Error loading procurement record");

            }

        }

        document.getElementById("dataForm")
            .addEventListener(
                "submit",
                async function (e) {

                    e.preventDefault();

                    const data = {

                        messid:
                            document.getElementById("messid").value,

                        supplierid:
                            document.getElementById("supplierid").value,

                        itemid:
                            document.getElementById("itemid").value,

                        quantity:
                            document.getElementById("quantity").value || null

                    };

                    try {

                        const url =
                            oldMess === null
                                ? "/api/procures"
                                : "/api/procures/" +
                                encodeURIComponent(oldMess) +
                                "/" +
                                encodeURIComponent(oldSupplier) +
                                "/" +
                                encodeURIComponent(oldItem);

                        const method =
                            oldMess === null
                                ? "POST"
                                : "PUT";

                        const response =
                            await fetch(url, {

                                method: method,

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify(data)

                            });

                        const result =
                            await response.json();

                        if (!response.ok) {

                            alert(
                                result.error ||
                                "Operation failed"
                            );

                            return;

                        }

                        if (oldMess === null) {

                            alert(
                                "Procurement added successfully"
                            );

                        } else {

                            alert(
                                "Procurement updated successfully"
                            );

                        }

                        resetForm();

                        loadData();

                    } catch (error) {

                        console.error(error);

                        alert("Error saving procurement record");

                    }

                }
            );

        async function deleteData(messId, supplierId, itemId) {

            if (
                !confirm(
                    "Are you sure you want to delete this procurement record?"
                )
            ) {

                return;

            }

            try {

                const response =
                    await fetch(
                        "/api/procures/" +
                        encodeURIComponent(messId) +
                        "/" +
                        encodeURIComponent(supplierId) +
                        "/" +
                        encodeURIComponent(itemId),
                        {
                            method: "DELETE"
                        }
                    );

                const result =
                    await response.json();

                if (!response.ok) {

                    alert(
                        result.error ||
                        "Delete failed"
                    );

                    return;

                }

                alert(
                    "Procurement deleted successfully"
                );

                loadData();

            } catch (error) {

                console.error(error);

                alert("Error deleting procurement record");

            }

        }

        function resetForm() {

            oldMess = null;
            oldSupplier = null;
            oldItem = null;

            document.getElementById("dataForm").reset();

            document.getElementById("messid").disabled =
                false;

            document.getElementById("supplierid").disabled =
                false;

            document.getElementById("itemid").disabled =
                false;

            document.getElementById("formTitle").textContent =
                "Add Procurement";

            document.getElementById("submitButton").textContent =
                "Add Procurement";

            document.getElementById("formContainer").style.display =
                "none";

        }

        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }

        function escapeJs(value) {

            return String(value)
                .replaceAll("\\", "\\\\")
                .replaceAll("'", "\\'");

        }

        loadMess();
        loadSuppliers();
        loadItems();
        loadData();

    </script>

</body>

</html>
