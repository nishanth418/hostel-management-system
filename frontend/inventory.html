<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
</head>

<body>

    <nav class="navbar">
        <a href="/">Home</a>
        <a href="/students">Students</a>
        <a href="/hostels">Hostels</a>
        <a href="/mess">Mess</a>
        <a href="/payments">Payments</a>
        <a href="/reports">Reports</a>
        <a href="/queries">SQL Query</a>
    </nav>

    <h1>Inventory Management</h1>

    <a href="/" class="back">← Back to Dashboard</a>

    <h2>Inventory Items</h2>

    <button onclick="loadData()">Refresh</button>

    <table>

        <thead>
            <tr>
                <th>Item ID</th>
                <th>Item Name</th>
                <th>Category</th>
                <th>Unit</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="tableBody">
        </tbody>

    </table>

    <div class="add-button-container">
        <button onclick="showForm()">+ Add Inventory Item</button>
    </div>

    <div class="form-container" id="formContainer" style="display: none;">

        <h2 id="formTitle">Add Inventory Item</h2>

        <form id="dataForm">

            <label>Item ID</label>
            <input type="text" id="itemid" required>

            <label>Item Name</label>
            <input type="text" id="itemname">

            <label>Category</label>
            <select id="category">
                <option value="">Select Category</option>
                <option value="Grains">Grains</option>
                <option value="Dairy">Dairy</option>
                <option value="Cooking Oil">Cooking Oil</option>
                <option value="Meat">Meat</option>
                <option value="Vegetables">Vegetables</option>
            </select>

            <label>Unit</label>
            <select id="unit">
                <option value="">Select Unit</option>
                <option value="Kg">Kg</option>
                <option value="Litre">Litre</option>
                <option value="Piece">Piece</option>
                <option value="Packet">Packet</option>
            </select>

            <button type="submit" id="submitButton">
                Add Inventory Item
            </button>

            <button type="button" onclick="resetForm()">
                Cancel
            </button>

        </form>

    </div>

    <script>

        let editingId = null;
        let inventoryData = [];

        async function loadData() {

            try {

                const response =
                    await fetch("/api/inventory");

                const data =
                    await response.json();

                inventoryData = data;

                const tbody =
                    document.getElementById("tableBody");

                tbody.innerHTML = "";

                if (data.length === 0) {

                    tbody.innerHTML =
                        "<tr><td colspan='5'>No inventory records found.</td></tr>";

                    return;

                }

                data.forEach(row => {

                    const tr =
                        document.createElement("tr");

                    tr.innerHTML = `
                        <td>${escapeHtml(row.itemid ?? "")}</td>

                        <td>${escapeHtml(row.itemname ?? "")}</td>

                        <td>${escapeHtml(row.category ?? "")}</td>

                        <td>${escapeHtml(row.unit ?? "")}</td>

                        <td>
                            <button onclick="editData('${escapeJs(row.itemid)}')">
                                Edit
                            </button>

                            <button onclick="deleteData('${escapeJs(row.itemid)}')">
                                Delete
                            </button>
                        </td>
                    `;

                    tbody.appendChild(tr);

                });

            } catch (error) {

                console.error(error);

                alert("Error loading inventory");

            }

        }

        function showForm() {

            if (editingId === null) {

                document.getElementById("dataForm").reset();

                document.getElementById("formTitle").textContent =
                    "Add Inventory Item";

                document.getElementById("submitButton").textContent =
                    "Add Inventory Item";

            }

            document.getElementById("formContainer").style.display =
                "block";

            document.getElementById("itemid").disabled =
                editingId !== null;

            window.scrollTo({
                top: document.getElementById("formContainer").offsetTop,
                behavior: "smooth"
            });

        }

        function editData(id) {

            try {

                const row =
                    inventoryData.find(
                        x => x.itemid === id
                    );

                if (!row) {

                    alert("Inventory item not found");

                    return;

                }

                editingId = id;

                document.getElementById("itemid").value =
                    row.itemid ?? "";

                document.getElementById("itemname").value =
                    row.itemname ?? "";

                document.getElementById("category").value =
                    row.category ?? "";

                document.getElementById("unit").value =
                    row.unit ?? "";

                document.getElementById("itemid").disabled =
                    true;

                document.getElementById("formTitle").textContent =
                    "Edit Inventory Item";

                document.getElementById("submitButton").textContent =
                    "Update Inventory Item";

                document.getElementById("formContainer").style.display =
                    "block";

                window.scrollTo({
                    top: document.getElementById("formContainer").offsetTop,
                    behavior: "smooth"
                });

            } catch (error) {

                console.error(error);

                alert("Error loading inventory item");

            }

        }

        document.getElementById("dataForm")
            .addEventListener(
                "submit",
                async function (e) {

                    e.preventDefault();

                    const data = {

                        itemid:
                            document.getElementById("itemid").value.trim(),

                        itemname:
                            document.getElementById("itemname").value.trim(),

                        category:
                            document.getElementById("category").value,

                        unit:
                            document.getElementById("unit").value

                    };

                    try {

                        const url =
                            editingId === null
                                ? "/api/inventory"
                                : "/api/inventory/" +
                                encodeURIComponent(editingId);

                        const method =
                            editingId === null
                                ? "POST"
                                : "PUT";

                        const response =
                            await fetch(url, {

                                method: method,

                                headers: {
                                    "Content-Type": "application/json"
                                },

                                body: JSON.stringify(data)

                            });

                        const result =
                            await response.json();

                        if (!response.ok) {

                            alert(
                                result.error ||
                                "Operation failed"
                            );

                            return;

                        }

                        if (editingId === null) {

                            alert(
                                "Inventory item added successfully"
                            );

                        } else {

                            alert(
                                "Inventory item updated successfully"
                            );

                        }

                        resetForm();

                        loadData();

                    } catch (error) {

                        console.error(error);

                        alert("Error saving inventory item");

                    }

                }
            );

        async function deleteData(id) {

            if (
                !confirm(
                    "Are you sure you want to delete inventory item " +
                    id +
                    "?"
                )
            ) {

                return;

            }

            try {

                const response =
                    await fetch(
                        "/api/inventory/" +
                        encodeURIComponent(id),
                        {
                            method: "DELETE"
                        }
                    );

                const result =
                    await response.json();

                if (!response.ok) {

                    alert(
                        result.error ||
                        "Delete failed"
                    );

                    return;

                }

                alert(
                    "Inventory item deleted successfully"
                );

                loadData();

            } catch (error) {

                console.error(error);

                alert("Error deleting inventory item");

            }

        }

        function resetForm() {

            editingId = null;

            document.getElementById("dataForm").reset();

            document.getElementById("itemid").disabled =
                false;

            document.getElementById("formTitle").textContent =
                "Add Inventory Item";

            document.getElementById("submitButton").textContent =
                "Add Inventory Item";

            document.getElementById("formContainer").style.display =
                "none";

        }

        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }

        function escapeJs(value) {

            return String(value)
                .replaceAll("\\", "\\\\")
                .replaceAll("'", "\\'");

        }

        loadData();

    </script>

</body>

</html>
